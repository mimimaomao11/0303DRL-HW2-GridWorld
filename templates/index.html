<!DOCTYPE html>
<html>

<head>

    <title>GridWorld</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        .grid {
            display: grid;
            gap: 5px;
            justify-content: center;
            margin: 20px auto;
        }

        .cell {
            width: 70px;
            height: 70px;
            border: 1px solid black;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
        }

        .start {
            background: green;
            color: white;
        }

        .end {
            background: red;
            color: white;
        }

        .obstacle {
            background: gray;
            color: white;
        }

        .path {
            background: #cfeffd;
        }

        .start.path {
            background: green;
        }

        .end.path {
            background: red;
        }

        .matrixTitle {
            margin-top: 30px;
            font-weight: bold;
            font-size: 20px;
        }
    </style>

</head>

<body>

    <h2>GridWorld</h2>

    <label>Grid Size (3-10):</label>
    <input type="number" id="size" value="4" min="3" max="10">

    <label style="margin-left:12px">γ (discount):</label>
    <input type="number" id="gamma" value="0.9" step="0.01" min="0" max="1">

    <label style="margin-left:12px">θ (converge):</label>
    <input type="number" id="theta" value="0.0001" step="0.0001" min="0">

    <button onclick="createGrid()">Create Grid</button>
    <button onclick="resetGrid()">Reset</button>
    <button onclick="compute()">Generate Value &amp; Policy</button>

    <p>
        Click grid to set Start, End and Obstacles
    </p>

    <!-- Three matrices side by side -->
    <div style="display:flex; gap:40px; justify-content:center; flex-wrap:wrap; align-items:flex-start;">

        <div>
            <div class="matrixTitle">Interactive Grid</div>
            <div id="grid" class="grid"></div>
        </div>

        <div>
            <div class="matrixTitle">Policy Matrix <small style="font-weight:normal">(隨機預填，請先點 Generate)</small></div>
            <div id="policyGrid" class="grid"></div>
        </div>

        <div>
            <div class="matrixTitle">Value Matrix</div>
            <div id="valueGrid" class="grid"></div>
        </div>

    </div>

    

    <script src="/static/script.js"></script>

</body>

</html>
